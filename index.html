<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2900e" />
    <meta name="description" content="Meadhall — your private, local-first personal command center: tasks, notes, habits, focus timer, journal, bookmarks and finances in one warm place." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      try {
        var stored = localStorage.getItem('meadhall:settings');
        var settings = stored ? JSON.parse(stored) : null;
        var mode = settings && settings.state ? settings.state.themeMode : 'system';
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        var accent = settings && settings.state ? settings.state.accent : 'honey';
        if (accent) document.documentElement.dataset.accent = accent;
      } catch (e) {}
    </script>
    <title>Meadhall</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
